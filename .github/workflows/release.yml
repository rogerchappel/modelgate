name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install ReleaseBox
        run: |
          git clone --depth 1 --branch v0.1.0 https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          cd /tmp/releasebox
          npm ci
          npm run build

      - name: ReleaseBox check
        run: node /tmp/releasebox/bin/releasebox.js check .

      - name: Release check
        run: npm run release:check

      - name: Pack npm artifact
        id: pack
        run: |
          package_file="$(npm pack --json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data)[0].filename))")"
          echo "package_file=${package_file}" >> "$GITHUB_OUTPUT"

      - name: Publish npm artifact
        run: npm publish "${{ steps.pack.outputs.package_file }}" --provenance --access public

      - name: Generate release notes
        run: node /tmp/releasebox/bin/releasebox.js notes . > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md "${{ steps.pack.outputs.package_file }}"
